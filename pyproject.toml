[project]
name = "portfolio-management"
version = "0.1.0"
description = ""
authors = [
    {name = "Kélian PONS",email = "kelian.pons@centrale.centralelille.fr"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "stable-baselines3 (>=2.8.0,<3.0.0)",
    "gymnasium (>=1.2.3,<2.0.0)",
    "requests (>=2.33.1,<3.0.0)",
    "pandas (>=2.2.0,<3.0.0)",
    "pandas-ta (>=0.4.71b0,<0.5.0)",
    "yfinance (>=1.3.0,<2.0.0)",
    "nbformat (>=5.10.4,<6.0.0)",
    "numpy (<2.2.7)",
    "pydantic (>=2.13.4,<3.0.0)"
    
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.0.3,<10.0.0)",
    "pytest-mock (>=3.15.1,<4.0.0)",
    "ipykernel (>=7.2.0,<8.0.0)",
    "plotly (>=6.7.0,<7.0.0)"
]

[tool.pytest.ini_options]
# Allow pytest to find the 'agent' package inside 'src'
pythonpath = [
  "src"
]
# Specify where the tests are located
testpaths = [
  "tests"
]